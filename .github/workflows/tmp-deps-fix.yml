name: tmp-deps-fix
on:
  push:
    branches: [chore/OD-11-engineering-guardrails]
    paths: [.github/workflows/tmp-deps-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/OD-11-engineering-guardrails
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm install next@16.4.0 eslint-config-next@16.4.0
      - run: npm audit fix || true
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: build
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            tail -60 build.log | grep -v '^\s*$' | tail -25 | while IFS= read -r l; do echo "::error title=build::$l"; done
            exit 1
          fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): upgrade next to 16.4.0 and patch audit findings (OD-19)"
          git push
